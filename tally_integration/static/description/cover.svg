<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Odoo 19 and TallyPrime two-way integration</title>
  <desc id="desc">Scidecs open-source connector for accounting and inventory synchronization</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182f"/>
      <stop offset="1" stop-color="#26396f"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a24689"/>
      <stop offset="1" stop-color="#20b8b0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#050814" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1600" height="800" rx="48" fill="#17213d"/>
  <circle cx="1450" cy="90" r="260" fill="#ffffff" opacity="0.035"/>
  <circle cx="70" cy="760" r="300" fill="#20b8b0" opacity="0.07"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="100" y="110" fill="#86eee4" font-size="28" font-weight="700" letter-spacing="5">SCIDECS CONNECT</text>
    <text x="100" y="205" fill="#ffffff" font-size="72" font-weight="700">Odoo 19</text>
    <text x="410" y="205" fill="#f8c451" font-size="72" font-weight="700">&#8596;</text>
    <text x="505" y="205" fill="#ffffff" font-size="72" font-weight="700">TallyPrime</text>
    <text x="100" y="270" fill="#dce5ff" font-size="35">Two-way accounting &amp; inventory synchronization</text>

    <g transform="translate(105 345)">
      <rect width="360" height="230" rx="34" fill="#ffffff"/>
      <rect x="32" y="34" width="78" height="78" rx="18" fill="#a24689"/>
      <text x="71" y="88" fill="#ffffff" font-size="38" font-weight="700" text-anchor="middle">O</text>
      <text x="135" y="73" fill="#141a2d" font-size="35" font-weight="700">ODOO ERP</text>
      <text x="135" y="108" fill="#667085" font-size="20">Operations &amp; workflow</text>
      <text x="34" y="165" fill="#334155" font-size="23">Sales &#8226; Purchase &#8226; Inventory</text>
      <text x="34" y="202" fill="#334155" font-size="23">Payments &#8226; Warehouses &#8226; GST</text>
    </g>

    <g transform="translate(620 375)">
      <rect x="0" y="61" width="300" height="18" rx="9" fill="#20b8b0"/>
      <polygon points="300,35 342,70 300,105" fill="#20b8b0"/>
      <rect x="42" y="126" width="300" height="18" rx="9" fill="#a24689"/>
      <polygon points="42,100 0,135 42,170" fill="#a24689"/>
      <rect x="70" y="190" width="205" height="48" rx="24" fill="#ffffff" opacity="0.12"/>
      <text x="172" y="222" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">DIRECT OR LAN AGENT</text>
    </g>

    <g transform="translate(1115 345)">
      <rect width="380" height="230" rx="34" fill="#ffffff"/>
      <rect x="32" y="34" width="78" height="78" rx="18" fill="#f8c451"/>
      <text x="71" y="87" fill="#18213d" font-size="36" font-weight="800" text-anchor="middle">T</text>
      <text x="135" y="73" fill="#141a2d" font-size="35" font-weight="700">TALLYPRIME</text>
      <text x="135" y="108" fill="#667085" font-size="20">Accounting book</text>
      <text x="34" y="165" fill="#334155" font-size="21">Ledgers &#8226; Vouchers &#8226; Godowns</text>
      <text x="34" y="202" fill="#334155" font-size="21">Tax &#8226; Stock Journal &#8226; Cost Centres</text>
    </g>

    <g transform="translate(100 675)">
      <rect width="265" height="58" rx="29" fill="#20b8b0"/>
      <text x="132" y="38" fill="#071d24" font-size="22" font-weight="800" text-anchor="middle">FREE &#8226; LGPL-3</text>
      <rect x="390" width="335" height="58" rx="29" fill="#ffffff" opacity="0.12"/>
      <text x="557" y="38" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">20 SYNC ENTITY TYPES</text>
      <rect x="750" width="365" height="58" rx="29" fill="#ffffff" opacity="0.12"/>
      <text x="932" y="38" fill="#ffffff" font-size="22" font-weight="700" text-anchor="middle">LIVE-TALLY VALIDATED</text>
      <text x="1395" y="38" fill="#dce5ff" font-size="24" font-weight="700" text-anchor="end">scidecs.com</text>
