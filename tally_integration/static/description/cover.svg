<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Scidecs Odoo 19 and TallyPrime integration</title>
  <desc id="desc">A live-validated open-source connector linking Odoo operations with TallyPrime accounting</desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ed2df"/>
      <stop offset="1" stop-color="#4a7fe8"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020816" flood-opacity="0.34"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa7d3" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1600" height="800" rx="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1600" height="800" fill="#071329"/>
    <rect width="1600" height="800" fill="url(#grid)"/>
    <path d="M1165 -110C1390 -38 1566 112 1660 328V-110Z" fill="#4a7fe8" opacity="0.08"/>
    <path d="M-140 650C65 565 242 610 398 840H-140Z" fill="#4ed2df" opacity="0.07"/>

    <!-- Brand bar -->
    <image href="assets/scidecs_mark.png" xlink:href="assets/scidecs_mark.png" x="72" y="54" width="44" height="44"/>
    <g font-family="Inter, Arial, sans-serif">
      <text x="128" y="86" fill="#ffffff" font-size="25" font-weight="700" letter-spacing="0.5">SCIDECS</text>
      <line x1="258" y1="70" x2="296" y2="70" stroke="#4ed2df" stroke-width="2"/>
      <text x="311" y="80" fill="#9eb0ca" font-size="14" font-weight="700" letter-spacing="2.2">CONNECT</text>
      <text x="1528" y="80" fill="#9eb0ca" font-size="14" font-weight="700" letter-spacing="1.8" text-anchor="end">ODOO 19  /  TALLYPRIME</text>

      <!-- Editorial message -->
      <text x="72" y="198" fill="#ffffff" font-size="62" font-weight="700">Odoo operations.</text>
      <text x="72" y="270" fill="#ffffff" font-size="62" font-weight="700">Tally books.</text>
      <text x="72" y="342" fill="#4ed2df" font-size="62" font-weight="700">Always in sync.</text>
      <text x="74" y="400" fill="#bac7da" font-size="22">Two-way accounting and inventory synchronization</text>
      <text x="74" y="433" fill="#bac7da" font-size="22">through TallyPrime's native XML gateway.</text>

      <!-- Feature rails -->
      <g transform="translate(72 492)">
        <rect width="598" height="2" fill="#28405f"/>
        <circle cx="7" cy="53" r="6" fill="#4ed2df"/>
        <text x="28" y="59" fill="#ffffff" font-size="18" font-weight="700">Direct gateway or private-LAN agent</text>
        <circle cx="7" cy="98" r="6" fill="#4ed2df"/>
        <text x="28" y="104" fill="#ffffff" font-size="18" font-weight="700">Per-entity direction and ownership</text>
        <circle cx="7" cy="143" r="6" fill="#4ed2df"/>
        <text x="28" y="149" fill="#ffffff" font-size="18" font-weight="700">Durable queue, retry evidence and quarantine</text>
      </g>

      <!-- System panels: equal size and padding -->
      <g filter="url(#panelShadow)">
        <rect x="790" y="142" width="738" height="186" rx="22" fill="#ffffff"/>
        <rect x="790" y="392" width="738" height="186" rx="22" fill="#ffffff"/>
      </g>
      <rect x="790" y="142" width="8" height="186" rx="4" fill="#714b67"/>
      <rect x="790" y="392" width="8" height="186" rx="4" fill="#22a9c3"/>

      <!-- Odoo panel -->
      <image href="assets/odoo_logo.png" xlink:href="assets/odoo_logo.png" x="842" y="174" width="168" height="90" preserveAspectRatio="xMidYMid meet"/>
      <line x1="1050" y1="174" x2="1050" y2="294" stroke="#e4e8ef" stroke-width="1"/>
      <text x="1090" y="190" fill="#714b67" font-size="13" font-weight="800" letter-spacing="1.8">OPERATIONS SYSTEM</text>
      <text x="1090" y="229" fill="#172033" font-size="25" font-weight="700">Sell. Buy. Move stock.</text>
      <text x="1090" y="264" fill="#5d6b80" font-size="18">Products  •  Partners  •  Payments</text>
      <text x="1090" y="292" fill="#5d6b80" font-size="18">Warehouses  •  GST  •  Journals</text>

      <!-- TallyPrime panel -->
      <image href="assets/tallyprime_logo.png" xlink:href="assets/tallyprime_logo.png" x="836" y="437" width="190" height="58" preserveAspectRatio="xMidYMid meet"/>
      <line x1="1050" y1="424" x2="1050" y2="544" stroke="#e4e8ef" stroke-width="1"/>
      <text x="1090" y="440" fill="#14889f" font-size="13" font-weight="800" letter-spacing="1.8">ACCOUNTING SYSTEM</text>
      <text x="1090" y="479" fill="#172033" font-size="25" font-weight="700">Account. Comply. Report.</text>
      <text x="1090" y="514" fill="#5d6b80" font-size="18">Ledgers  •  Vouchers  •  Tax</text>
      <text x="1090" y="542" fill="#5d6b80" font-size="18">Godowns  •  Stock Journal  •  Cost Centres</text>

      <!-- Connection rail -->
      <rect x="1090" y="350" width="332" height="3" rx="1.5" fill="url(#rail)"/>
      <path d="M1410 342L1426 351.5L1410 361Z" fill="#4ed2df"/>
      <path d="M1102 342L1086 351.5L1102 361Z" fill="#4a7fe8"/>
      <rect x="1180" y="334" width="152" height="36" rx="18" fill="#0c1d39" stroke="#36557f"/>
      <text x="1256" y="357" fill="#dbe8fa" font-size="13" font-weight="800" letter-spacing="1.2" text-anchor="middle">SYNC CONTROL</text>

      <!-- Proof strip -->
      <g transform="translate(72 692)">
        <rect width="1456" height="64" rx="10" fill="#ffffff" opacity="0.055"/>
        <line x1="362" y1="13" x2="362" y2="51" stroke="#506480"/>
        <line x1="724" y1="13" x2="724" y2="51" stroke="#506480"/>
        <line x1="1086" y1="13" x2="1086" y2="51" stroke="#506480"/>
        <text x="22" y="29" fill="#4ed2df" font-size="12" font-weight="800" letter-spacing="1.4">COVERAGE</text>
        <text x="22" y="50" fill="#ffffff" font-size="18" font-weight="700">20 sync entity types</text>
        <text x="384" y="29" fill="#4ed2df" font-size="12" font-weight="800" letter-spacing="1.4">DELIVERY</text>
        <text x="384" y="50" fill="#ffffff" font-size="18" font-weight="700">Direct + private LAN</text>
        <text x="746" y="29" fill="#4ed2df" font-size="12" font-weight="800" letter-spacing="1.4">EVIDENCE</text>
        <text x="746" y="50" fill="#ffffff" font-size="18" font-weight="700">Live Tally validated</text>
        <text x="1108" y="29" fill="#4ed2df" font-size="12" font-weight="800" letter-spacing="1.4">LICENSE</text>
        <text x="1108" y="50" fill="#ffffff" font-size="18" font-weight="700">Free • LGPL-3</text>
      </g>
    </g>
  </g>
</svg>
